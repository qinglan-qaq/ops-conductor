[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsconductor"
version = "0.1.0"
description = "运筹 OpsConductor：电商 ERP 多 Agent 运营系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qinglan-qaq" }]
keywords = ["ai-agent", "erp", "ecommerce", "mcp", "rag", "langgraph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "langgraph>=0.2",
    "mcp>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "alembic>=1.14",
    "aiosqlite>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opsconductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: exercises an external process or service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
